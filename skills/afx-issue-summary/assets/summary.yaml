# 替换占位符；人工检视后使用 issue submit-summary --summary-file 提交。
# 顶层字段是简短概述，body_md 展开技术分析；多条独立根因分别写，不堆执行流水账。
# IR/日志必须摘自实际现场；无 IR 的问题使用实际日志、代码或输入输出对照。
# 总结应独立可读，不写本地/远端机器绝对路径；源码与测试使用仓库相对路径和符号名。
kind: bugfix_function
title: "<明确的问题与修复主题>"
symptom: |
  <触发条件、期望行为与实际失败的简短概述>
root_cause: |
  <错误机制的简短概述；细节在正文按根因展开>
solution: |
  <修复策略及保持的语义>
fix_ref: "<实际修复 commit 完整 SHA；未提交时删除此字段>"
body_md: |
  ## 问题与复现条件
  <原始 seed 或最小复现命令，相关 Shape/dtype/后端/芯片，基线源码 SHA；只保留理解问题必需的信息>

  ## 根因与修复分析
  ### <根因名称；存在多个独立根因时按此结构分别展开>
  **错误现场**
  <该根因的触发条件、失败阶段及关键诊断>

  ```text
  <从实际 dump 摘录最小错误 IR，保留理解操作数、类型和转换所需的上下文>
  ```
  来源：<如“基线复现的 AFIR dump”；有可共享的平台记录或归档附件时附引用，不写机器路径>

  **错误机制**
  <结合实际片段和仓库相对源码路径/符号，从输入或上游语义追溯关键类型、属性或操作的来源、转换过程及违反约束的位置；只展开与根因有关的链路，不止于复述报错或列出失败函数>

  **修复行为**
  <对应 fix_ref 中的修改，解释为何保持原始语义，而非仅消除报错；替换操作、放宽判断或新增分支时，说明选择依据、适用边界及后续处理是否支持；有直接替代方案时简述取舍，需要对照时摘录实际修复后 IR>
  <没有修复后 IR 时明确写转换规则或预期行为，不把推导当实测；原始证据缺失则说明，不能编造现场>

  **验证依据**
  <测试文件/用例名、覆盖的语义及实际结果，说明证据证明的是编译通过、输出正确还是边界行为保持；测试对应修复所依赖的语义假设，必要时写同输入前后对照。影响结论的 skip、未运行或未覆盖条件就近说明；尚未证明的假设列为人工检视重点，不写成确定结论>

  ## 人工检视重点
  <需要人工确认的具体代码符号、语义边界和相邻分支；不重复修改清单>

  ## 同类问题定位指引
  - 识别信号：<有区分度的错误、IR 特征或输入组合>
  - 排查方法：<优先检查位置、对照方法、预期观察及如何排除相似原因>
  - 适用边界：<何时可借鉴、何时不能直接套用；区分事实与推断>

  平台索引：<平台地址 · issue ID · verify #轮次及结果 · regression #轮次及结果；无候选写“平台未选择回归候选”>
