[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afxx"
version = "0.1.0"
description = "AFX Extensions: development and repair toolkit for AFX"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["PyYAML>=6,<7", "mcp>=1.26,<2"]

[project.optional-dependencies]
dev = ["pytest", "jsonschema", "build", "ruff"]

[project.scripts]
afxx = "afxx.cli:cli"

[tool.setuptools.packages.find]
include = ["afxx*"]

[tool.setuptools.package-data]
afxx = ["resources/*.yaml", "environment/*.json"]
