[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "af-forge"
version = "0.1.0"
description = "Local and NPU development workflows for Graph-autofusion"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-CANN-Open-Software-2.0"
license-files = ["LICENSE"]
dependencies = ["PyYAML>=6,<7", "mcp>=1.26,<2"]

[project.optional-dependencies]
dev = ["pytest", "jsonschema", "build", "ruff"]

[project.scripts]
af-forge = "af_forge.cli:cli"
af-forge-mcp = "af_forge.mcp_server:main"

[tool.setuptools.packages.find]
include = ["af_forge*"]

[tool.setuptools.package-data]
af_forge = ["resources/*.yaml", "environment/*.json"]
